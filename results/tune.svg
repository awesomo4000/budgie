<line x1="140" y1="620" x2="1100" y2="620" stroke="#C3C8CE" stroke-width="1"/>
<text x="620" y="664" font-size="10.5" fill="#14181F" text-anchor="middle" font-weight="700">io_bufs — size of the I/O buffer pool (each 2904 bytes)</text>
<line x1="428" y1="100" x2="428" y2="620" stroke="#047857" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="436" y="118" font-size="10.5" fill="#047857" text-anchor="start" font-weight="700">knee at 32: 128,845 req/s, p50 168us</text>
<text x="40" y="692" font-size="10.5" fill="#14181F" text-anchor="start" font-weight="400">READ IT AS: the pool doubles as a concurrency limiter. Fewer buffers = fewer connections with I/O in flight = a shorter queue and a working set that fits cache</text>
<text x="40" y="708" font-size="10.5" fill="#14181F" text-anchor="start" font-weight="400">(32 x 2904B = 93KB, vs 3MB at 1024). Throughput is flat within noise from 32 up, but p50 falls 1.38ms -> 168us -> 26us as the pool shrinks. Nothing is shed:</text>
<text x="40" y="724" font-size="10.5" fill="#14181F" text-anchor="start" font-weight="400">non-2xx is zero at every point. Below 32 latency keeps improving and throughput finally drops, so 16-32 is the operating point. epoll cannot do this: its buffers</text>
<text x="40" y="740" font-size="10.5" fill="#14181F" text-anchor="start" font-weight="400">are per-connection, so shrinking the pool starves it (7k req/s at 4) instead of limiting concurrency.</text>
</svg>
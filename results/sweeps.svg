<text x="40.0" y="1084.0" font-size="10.5" fill="#14181F" text-anchor="start" font-weight="400">Iterations track the grant exactly: 400→480, 5,000→6,000, 25,000→30,000. Linear, zero drift, and every setting starved exactly once per period —</text>
<text x="40.0" y="1100.0" font-size="10.5" fill="#14181F" text-anchor="start" font-weight="400">the limiter is precise, not approximate. You can buy 6,000 background iterations for a 10% p99 cost, or 30,000 for 3x. That is the decision this plot makes for you.</text>

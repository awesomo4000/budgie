<text x="40.0" y="570.0" font-size="10.5" fill="#14181F" text-anchor="start" font-weight="400">LEFT EDGE: every unit of work pays a scheduler round-trip. 56k req/s, p99 8.0ms.</text>
<text x="40.0" y="586.0" font-size="10.5" fill="#14181F" text-anchor="start" font-weight="400">RIGHT EDGE: turns are too coarse, so a long request hogs its turn and the tail fattens again. 76k req/s, p99 5.1ms.</text>
<text x="40.0" y="602.0" font-size="10.5" fill="#14181F" text-anchor="start" font-weight="400">MIDDLE: 87k req/s, p99 4.25ms. Worst-to-best is 1.55x throughput and 1.9x p99 — far outside the noise band, so it is real.</text>
<text x="40.0" y="660.0" font-size="13.5" fill="#14181F" text-anchor="start" font-weight="700">② BACKGROUND BUDGET SWEEP — how much CPU a non-connection task may spend per period</text>
<text x="40.0" y="678.0" font-size="11" fill="#5A6470" text-anchor="start" font-weight="400">Categorical x (uneven steps). All connections fast, quantum fixed at 250. The background task is pure CPU and never touches I/O.</text>
